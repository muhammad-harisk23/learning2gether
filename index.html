<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FAF9F5" />
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("k12learn2gether.theme") === "dark" ? "dark" : "light";
      } catch {
        document.documentElement.dataset.theme = "light";
      }
      document.querySelector('meta[name="theme-color"]')?.setAttribute(
        "content",
        document.documentElement.dataset.theme === "dark" ? "#1D201D" : "#FAF9F5",
      );
    </script>
    <meta name="description" content="Bring what you already want to learn. K12Learn2Gether helps you focus on one lesson and continue where you left off." />
    <title>K12Learn2Gether — Less Searching. More Finishing.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
